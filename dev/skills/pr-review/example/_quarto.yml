project:
  type: default
  # Render only the tab page; the .md files stay plain markdown
  render:
    - index.qmd
  output-dir: _site

# Links like ../crabs/... in the .md files point here instead
code-base-url: https://github.com/SainsburyWellcomeCentre/crabs-exploration/blob/1b9c04f9c0860b94912ca4d11730964029235ca2/

format:
  html:
    title: PR review
    page-layout: full
    toc: false
    css: styles.css
    filters:
      - gh-alerts.lua
      - mermaid.lua
    include-after-body: mermaid.html
