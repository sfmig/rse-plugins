<script type="module">
  import mermaid from "https://cdn.jsdelivr.net/npm/mermaid@11.4.1/dist/mermaid.esm.min.mjs";

  // "loose" lets click lines in diagrams open links
  mermaid.initialize({ startOnLoad: false, securityLevel: "loose" });

  // Draw only visible diagrams: diagrams in hidden tabs or closed <details>
  // come out blank, so they are drawn when first shown
  const draw = () =>
    mermaid.run({
      nodes: [...document.querySelectorAll("pre.mermaid:not([data-processed])")].filter(
        (n) => n.offsetParent !== null
      ),
    });
  document.addEventListener("shown.bs.tab", draw);
  document.addEventListener("toggle", draw, true); // <details> opened (toggle does not bubble)
  draw();
</script>
